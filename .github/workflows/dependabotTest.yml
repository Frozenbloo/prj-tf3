name: Dependabot Check

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  dependabot-checks:
    name: Dependabot Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    # Step 1: Checkout the pull request code
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 2: Fetch Dependabot alerts from GitHub API and save to dependabot-alerts.json
    - name: Fetch Dependabot alerts
      id: fetch_alerts
      run: |
        curl -H "Accept: application/vnd.github.v3+json" \
             -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
             https://api.github.com/repos/${{ github.repository }}/dependabot/alerts \
             > dependabot-alerts.json

    # Step 3: Check if dependency files (package.json, package-lock.json, or yarn.lock) have changed in the PR
    - name: Check if dependencies changed
      id: extract_changes
      run: |
        git fetch origin main

        git diff --name-only origin/main > changed_files.txt

        if grep -qE 'package.json|package-lock.json|yarn.lock' changed_files.txt; then
          echo "true" > dep_changed.txt
        else
          echo "false" > dep_changed.txt

    # Step 4: Compare dependencies and create a report if dependencies have changed
    - name: Compare dependencies and create report
      if: steps.extract_changes.outputs.dep_changed == 'true'
      id: compare_deps
      run: |
        fixed_issues=""
        new_issues=""
        alerts=$(jq -c '.[]' dependabot-alerts.json)

        get_dependencies_from_package_json() {
          jq -r '.[].version' package.json
        }

        get_dependencies_from_yarn_lock() {
          yarn list --json | jq -r '.data.trees[] | {name: .name, version: .version}'
        }

        if git diff --name-only origin/main | grep -qE 'package.json|package-lock.json'; then
          old_deps=$(git show origin/main:package.json | jq -r '.[].version')
          new_deps=$(jq -r '.[].version' package.json)

          for alert in $alerts; do
            dep=$(echo "$alert" | jq -r '.security_advisory.ghsa_id')
            summary=$(echo "$alert" | jq -r '.security_advisory.summary')

            old_version=$(echo "$old_deps" | jq -r ".${dep}")
            new_version=$(echo "$new_deps" | jq -r ".${dep}")

            if [ "$old_version" != "$new_version" ]; then
              fixed_issues="${fixed_issues}| ${dep} | ${new_version} | ✔️ |\n"
            else
              new_issues="${new_issues}| ${dep} | ${new_version} | ❌ |\n"
            fi
          done
        fi

        if git diff --name-only origin/main | grep -q 'yarn.lock'; then
          old_deps=$(git show origin/main:yarn.lock | yarn list --json | jq -r '.data.trees[] | {name: .name, version: .version}')
          new_deps=$(yarn list --json | jq -r '.data.trees[] | {name: .name, version: .version}')

          for alert in $alerts; do
            dep=$(echo "$alert" | jq -r '.security_advisory.ghsa_id')
            summary=$(echo "$alert" | jq -r '.security_advisory.summary')

            old_version=$(echo "$old_deps" | jq -r ".[] | select(.name == \"$dep\") | .version")
            new_version=$(echo "$new_deps" | jq -r ".[] | select(.name == \"$dep\") | .version")

            if [ "$old_version" != "$new_version" ]; then
              fixed_issues="${fixed_issues}| ${dep} | ${new_version} | ✔️ |\n"
            else
              new_issues="${new_issues}| ${dep} | ${new_version} | ❌ |\n"
            fi
          done
        fi

        echo "fixed_issues=${fixed_issues}" >> $GITHUB_ENV
        echo "new_issues=${new_issues}" >> $GITHUB_ENV

    # Step 5: Create the comment body based on the comparison results
    - name: Create comment body
      id: create_body
      run: |
        body="### Dependabot Check Results\n\n"
        body+="| Dependency | Version | Status |\n"
        body+="|------------|---------|--------|\n"

        # Add fixed issues to the comment
        if [ -n "$fixed_issues" ]; then
          body+="${fixed_issues}\n"
        else
          body+="| None | N/A | N/A |\n"
        fi

        body+="\n**New Issues:**\n"
        body+="| Dependency | Version | Status |\n"
        body+="|------------|---------|--------|\n"

        # Add new issues to the comment
        if [ -n "$new_issues" ]; then
          body+="${new_issues}\n"
        else
          body+="| None | N/A | N/A |\n"
        fi

        # Save the comment body to a file
        echo "$body" > comment_body.txt

    # Step 6: Post the comment on the pull request
    - name: Post comment on PR
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        path: comment_body.txt
