name: Dependabot Check

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  dependabot-check:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the pull request code
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 2: Fetch Dependabot alerts from GitHub API and save to dependabot-alerts.json
    - name: Fetch Dependabot alerts
      id: fetch_alerts
      run: |
        curl -H "Accept: application/vnd.github.v3+json" \
             -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
             https://api.github.com/repos/${{ github.repository }}/dependabot/alerts \
             > dependabot-alerts.json

    # Step 3: Check if dependency files (package.json, package-lock.json, or yarn.lock) have changed in the PR
    - name: Extract dependency changes
      id: extract_changes
      run: |
        git fetch origin main
        git diff origin/main --name-only > changed_files.txt
        if grep -qE 'package.json|package-lock.json|yarn.lock' changed_files.txt; then
          echo "dependencies_changed=true" >> $GITHUB_ENV
        else
          echo "dependencies_changed=false" >> $GITHUB_ENV
        fi

    # Step 4: Compare dependencies and create a report if dependencies have changed
    - name: Compare dependencies
      if: env.dependencies_changed == 'true'
      id: compare_deps
      run: |
        fixed_issues=""
        new_issues=""
        alerts=$(jq -c '.[]' dependabot-alerts.json)

        for alert in $alerts; do
          dep=$(echo "$alert" | jq -r '.dependency.name')
          summary=$(echo "$alert" | jq -r '.security_advisory.summary')

          if git diff --name-only origin/main | grep -qE 'package.json|package-lock.json'; then
            old_version=$(git show origin/main:package.json | jq -r ".dependencies[\"$dep\"]")
            new_version=$(jq -r ".dependencies[\"$dep\"]" package.json)
            if [ "$old_version" != "$new_version" ]; then
              fixed_issues="${fixed_issues}| ${dep} | ${new_version} | ✔️ |<br>"
            else
              new_issues="${new_issues}| ${dep} | ${new_version} | ❌ |<br>"
            fi
          fi

          if git diff --name-only origin/main | grep -q 'yarn.lock'; then
            old_version=$(git show origin/main:yarn.lock | grep "\"$dep\"")
            new_version=$(yarn list --pattern "$dep" --json | jq -r ".data.trees[] | select(.name == \"$dep\") | .version")
            if [ "$old_version" != "$new_version" ]; then
              fixed_issues="${fixed_issues}| ${dep} | ${new_version} | ✔️ |<br>"
            else
              new_issues="${new_issues}| ${dep} | ${new_version} | ❌ |<br>"
            fi
          fi
        done

        echo "fixed_issues=${fixed_issues}" >> $GITHUB_ENV
        echo "new_issues=${new_issues}" >> $GITHUB_ENV

    # Step 5: Create the comment body based on the comparison results
    - name: Create comment body
      id: create_body
      run: |
        body="**Dependabot Check Results**<br><br>"
        body+="| Dependency | Version | Status |<br>"
        body+="| ---------- | ------- | ------ |<br>"

        if [ -n "${{ env.fixed_issues }}" ]; then
          body+="${{ env.fixed_issues }}<br>"
        else
          body+="| None | N/A | N/A |<br>"
        fi

        body+="<br><br>**New Issues:**<br>"
        body+="| Dependency | Version | Status |<br>"
        body+="| ---------- | ------ | ------ |<br>"

        if [ -n "${{ env.new_issues }}" ]; then
          body+="${{ env.new_issues }}<br>"
        else
          body+="| None | N/A | N/A |<br>"
        fi

        echo "$body" > comment_body.txt

    # Step 6: Post the comment on the pull request
    - name: Post comment on PR
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        path: comment_body.txt
